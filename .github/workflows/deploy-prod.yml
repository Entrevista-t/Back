name: Deploy Back to Production

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-back-production
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/entrevista-t/back
  BASE_IMAGE: ghcr.io/entrevista-t/back:ml-base

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      ml_base: ${{ steps.filter.outputs.ml_base }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect relevant changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            ml_base:
              - 'infra/Dockerfile.ml-base'
              - 'requirements.txt'
              - 'requirements-base.txt'
              - 'requirements-audio-nlp.txt'
              - 'requirements-vision.txt'
              - 'requirements-dev.txt'

  build-ml-base:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.ml_base == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ML base image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./infra/Dockerfile.ml-base
          pull: true
          push: true
          tags: ${{ env.BASE_IMAGE }}
          cache-from: type=gha,scope=ml-base
          cache-to: type=gha,mode=max,scope=ml-base

  build-app:
    runs-on: ubuntu-latest
    needs:
      - changes
      - build-ml-base
    if: always() && (needs.build-ml-base.result == 'success' || needs.build-ml-base.result == 'skipped')
    outputs:
      image: ${{ steps.meta.outputs.image }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        run: |
          echo "image=${IMAGE_NAME}:sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "latest=${IMAGE_NAME}:latest" >> "$GITHUB_OUTPUT"

      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./infra/Dockerfile
          pull: true
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.meta.outputs.latest }}
          build-args: |
            BASE_IMAGE=${{ env.BASE_IMAGE }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

  deploy:
    runs-on: ubuntu-latest
    needs: build-app

    steps:
      - name: Deploy to Swarm manager
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_HOST }}
          port: ${{ secrets.PROD_PORT }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            set -e
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin
            docker pull "${{ needs.build-app.outputs.image }}"
            docker service update --image "${{ needs.build-app.outputs.image }}" "${{ vars.SERVICE_NAME }}"
            docker service inspect "${{ vars.SERVICE_NAME }}" --format '{{.Spec.TaskTemplate.ContainerSpec.Image}}'
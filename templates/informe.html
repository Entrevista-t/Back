<!DOCTYPE html>
<html>
<head>
    <style>
        @page {
            size: A4;
            margin: 20mm;
            @bottom-right { content: "Pàgina " counter(page) " de " counter(pages); font-size: 9pt; }
        }
        body { font-family: 'Helvetica', sans-serif; color: #333; line-height: 1.5; }
        .header { border-bottom: 2px solid #4A90E2; padding-bottom: 10px; margin-bottom: 20px; }
        .score-box { background: #f4f7f9; border-radius: 10px; padding: 20px; text-align: center; margin: 20px 0; }
        .score-num { font-size: 48pt; font-weight: bold; color: #4A90E2; }
        .section-title { color: #4A90E2; border-left: 4px solid #4A90E2; padding-left: 10px; margin-top: 30px; }
        .feedback-text { font-style: italic; background: #fffdf0; padding: 15px; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Informe d'Entrevista: {{ nom_usuari }}</h1>
        <p>Data: {{ data }} | Pregunta: {{ pregunta }}</p>
    </div>

    <div class="score-box">
        <p>Puntuació Global</p>
        <div class="score-num">{{ score }}/100</div>
    </div>

    <h2 class="section-title">Anàlisi del Coach (IA)</h2>
    <div class="feedback-text">
        {{ feedback_ia }}
    </div>

    <h2 class="section-title">Mètriques de Comunicació</h2>
    <ul>
        <li><strong>Ritme:</strong> {{ wpm }} paraules per minut</li>
        <li><strong>Confiança:</strong> {{ confiança }}%</li>
        <li><strong>Emoció dominant:</strong> {{ emocio }}</li>
    </ul>
</body>
</html>
